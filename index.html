<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient Background -->
  <div class="ambient-background" aria-hidden="true">
    <div class="blob blob-blue"></div>
    <div class="blob blob-lavender"></div>
    <div class="blob blob-mint"></div>
  </div>

  <header class="top-area glass-ambient">
    <div class="identity" aria-label="Start Page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    </div>
    <div class="top-controls">
      <button class="icon-button" id="settings-btn" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <main class="center-stage">
    <div class="time-container">
      <h1 class="clock" id="clock">--:--</h1>
      <p class="date" id="date">---</p>
    </div>

    <!-- Replaced Greeting with Weather -->
    <div class="weather-container" id="weather-container" aria-live="polite">
      <span class="weather-text" id="weather-text">--°C · Bangladesh</span>
    </div>

    <form class="search-container glass-primary" id="search-form" role="search">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" class="search-input" placeholder="Search the web" autocomplete="off" spellcheck="false" aria-label="Search">
      <div class="shortcut-hint" id="shortcut-hint" aria-hidden="true">⌘K</div>
    </form>

    <div class="favorites-grid" id="favorites-grid">
      <!-- Skeletons load immediately for perceived performance -->
      <div class="favorite-skeleton"></div>
      <div class="favorite-skeleton"></div>
      <div class="favorite-skeleton"></div>
      <div class="favorite-skeleton"></div>
    </div>
  </main>

  <!-- Command Palette -->
  <dialog class="command-palette glass-primary" id="command-palette">
    <form class="palette-search" id="palette-form">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="palette-input" placeholder="Search websites or commands..." autocomplete="off">
    </form>
    <ul class="palette-actions" id="palette-actions">
      <!-- Injected via JS -->
    </ul>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
